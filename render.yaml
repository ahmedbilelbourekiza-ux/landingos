# Render Blueprint for LandingOS.
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance,
# point it at this repo. Render reads this file and provisions the service
# below as an independent, isolated project — it will not touch any other
# service already on your Render account.
#
# AUTH_SECRET / ADMIN_USERNAME / ADMIN_PASSWORD are marked sync:false, meaning
# Render will prompt you to type them in during setup rather than storing a
# value here (so no secrets are committed to the repo).

services:
  - type: web
    name: landingos
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: landingos-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
